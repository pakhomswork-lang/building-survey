<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест камеры и выгрузки</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; color: #222; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint { margin: 0 0 16px; color: #666; font-size: 14px; }
  section { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  button, label.btn { display: block; width: 100%; box-sizing: border-box; padding: 14px; margin: 6px 0;
    font-size: 16px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; text-align: center; cursor: pointer; }
  button.secondary { background: #fff; color: #1f6feb; border: 2px solid #1f6feb; }
  button:active, label.btn:active { opacity: .6; }
  #status { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: #222; color: #fff;
    font-size: 14px; transform: translateY(100%); transition: transform .2s; }
  #status.show { transform: none; }
  button.danger { background: #d9534f; }
  input[type=file] { display: none; }
  #thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; }
  #thumbs figure { margin: 0; font-size: 10px; word-break: break-all; }
  #thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
  #log { font: 12px/1.4 monospace; white-space: pre-wrap; background: #111; color: #9f9; padding: 8px; border-radius: 6px; max-height: 260px; overflow: auto; }
</style>
</head>
<body>
<h1>Технический тест: камера и выгрузка фото</h1>
<p class="hint">Шаг 0. Проверяем, как телефон снимает, хранит и отдаёт фото. Пройди пункты 1–4 и пришли отчёт из пункта 5.</p>

<section>
  <h2>1. Снять фото</h2>
  <label class="btn" for="camera">Снять фото камерой</label>
  <input id="camera" type="file" accept="image/*" capture="environment" multiple>
  <div id="thumbs"></div>
</section>

<section>
  <h2>2. Хранение</h2>
  <p class="hint">Закрой вкладку, открой снова: фото должны остаться.</p>
  <button class="secondary" id="persist">Попросить постоянное хранение</button>
  <button class="secondary" id="estimate">Сколько места занято</button>
</section>

<section>
  <h2>3. Выгрузка</h2>
  <button id="exportFiles">Скачать фото по одному</button>
  <button id="exportZip">Скачать всё одним архивом (ZIP)</button>
  <button id="share">Поделиться (например, в Яндекс.Диск)</button>
  <button id="saveToFolder">Сохранить в выбранную папку</button>
</section>

<section>
  <h2>4. Очистка</h2>
  <button class="danger" id="clear">Удалить все тестовые фото</button>
</section>

<section>
  <h2>5. Отчёт</h2>
  <button class="secondary" id="copyLog">Скопировать отчёт</button>
  <div id="log"></div>
</section>

<div id="status"></div>

<script>
// ---------- журнал ----------
const logEl = document.getElementById('log');
function log(msg) {
  const line = new Date().toLocaleTimeString() + '  ' + msg;
  logEl.textContent += line + '\n';
  logEl.scrollTop = logEl.scrollHeight;
  // показываем результат внизу экрана, чтобы не листать до отчёта
  const status = document.getElementById('status');
  status.textContent = msg;
  status.classList.add('show');
  clearTimeout(log.timer);
  log.timer = setTimeout(() => status.classList.remove('show'), 4000);
}
window.addEventListener('error', e => log('ОШИБКА: ' + e.message));
window.addEventListener('unhandledrejection', e => log('ОШИБКА: ' + (e.reason && e.reason.message || e.reason)));

// ---------- хранилище (IndexedDB) ----------
function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('spike-photos', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('photos', { keyPath: 'name' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function tx(mode, fn) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const t = db.transaction('photos', mode);
    const result = fn(t.objectStore('photos'));
    t.oncomplete = () => resolve(result.result !== undefined ? result.result : result);
    t.onerror = () => reject(t.error);
  });
}
const savePhoto = rec => tx('readwrite', s => s.put(rec));
const allPhotos = () => tx('readonly', s => s.getAll());
const clearPhotos = () => tx('readwrite', s => s.clear());

// ---------- уникальное имя файла ----------
function uniqueName(file) {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  const rand = Math.random().toString(36).slice(2, 6);
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  return stamp + '_' + rand + '.' + ext;
}

// ---------- съёмка ----------
document.getElementById('camera').addEventListener('change', async e => {
  for (const file of e.target.files) {
    const name = uniqueName(file);
    await savePhoto({ name, blob: file, originalName: file.name, size: file.size, type: file.type, takenAt: Date.now() });
    log('Сохранено: ' + name + ' (исходное имя: ' + file.name + ', ' + Math.round(file.size / 1024) + ' КБ, ' + file.type + ')');
  }
  e.target.value = '';
  render();
});

async function render() {
  const photos = await allPhotos();
  const box = document.getElementById('thumbs');
  box.innerHTML = '';
  for (const p of photos) {
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    img.src = URL.createObjectURL(p.blob);
    fig.append(img, p.name);
    box.append(fig);
  }
  return photos;
}

// ---------- хранение ----------
document.getElementById('persist').addEventListener('click', async () => {
  if (!navigator.storage || !navigator.storage.persist) return log('persist(): не поддерживается');
  log('persist(): ' + (await navigator.storage.persist() ? 'разрешено' : 'отказано'));
});
document.getElementById('estimate').addEventListener('click', async () => {
  if (!navigator.storage || !navigator.storage.estimate) return log('estimate(): не поддерживается');
  const { usage, quota } = await navigator.storage.estimate();
  log('Занято ' + (usage / 1048576).toFixed(1) + ' МБ из доступных ' + (quota / 1048576).toFixed(0) + ' МБ');
});

// ---------- выгрузка ----------
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

document.getElementById('exportFiles').addEventListener('click', async () => {
  const photos = await allPhotos();
  if (!photos.length) return log('Нет фото для выгрузки');
  for (const p of photos) {
    download(p.blob, p.name);
    await new Promise(r => setTimeout(r, 400));
  }
  log('Скачивание по одному: отправлено ' + photos.length + ' файлов. Проверь папку «Загрузки».');
});

document.getElementById('exportZip').addEventListener('click', async () => {
  const photos = await allPhotos();
  if (!photos.length) return log('Нет фото для выгрузки');
  const files = [];
  for (const p of photos) files.push({ name: p.name, data: new Uint8Array(await p.blob.arrayBuffer()) });
  const meta = photos.map(({ name, originalName, size, type, takenAt }) => ({ name, originalName, size, type, takenAt }));
  files.push({ name: 'metki.json', data: new TextEncoder().encode(JSON.stringify(meta, null, 2)) });
  const zip = makeZip(files);
  download(zip, 'test-export.zip');
  log('Архив: ' + photos.length + ' фото + metki.json, ' + (zip.size / 1048576).toFixed(1) + ' МБ. Проверь папку «Загрузки».');
});

document.getElementById('share').addEventListener('click', async () => {
  const photos = await allPhotos();
  if (!photos.length) return log('Нет фото для выгрузки');
  const files = photos.map(p => new File([p.blob], p.name, { type: p.type || 'image/jpeg' }));
  if (!navigator.canShare || !navigator.canShare({ files })) return log('Поделиться файлами: не поддерживается');
  try {
    await navigator.share({ files, title: 'Тестовые фото' });
    log('Поделиться: окно открыто, отправлено ' + files.length + ' файлов. Проверь имена файлов там, куда отправил.');
  } catch (err) {
    log('Поделиться: отменено или ошибка (' + err.name + ')');
  }
});

document.getElementById('saveToFolder').addEventListener('click', async () => {
  const photos = await allPhotos();
  if (!photos.length) return log('Нет фото для выгрузки');
  if (!('showDirectoryPicker' in window)) return log('Сохранить в папку: не поддерживается');
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    for (const p of photos) {
      const fh = await dir.getFileHandle(p.name, { create: true });
      const w = await fh.createWritable();
      await w.write(p.blob);
      await w.close();
    }
    const meta = photos.map(({ name, originalName, size, type, takenAt }) => ({ name, originalName, size, type, takenAt }));
    const fh = await dir.getFileHandle('metki.json', { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(meta, null, 2));
    await w.close();
    log('Сохранить в папку «' + dir.name + '»: записано ' + photos.length + ' фото + metki.json');
  } catch (err) {
    log('Сохранить в папку: отменено или ошибка (' + err.name + ': ' + err.message + ')');
  }
});

document.getElementById('clear').addEventListener('click', async () => {
  if (!confirm('Удалить все тестовые фото из приложения?')) return;
  await clearPhotos();
  render();
  log('Тестовые фото удалены');
});

document.getElementById('copyLog').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(logEl.textContent);
    log('Отчёт скопирован');
  } catch {
    log('Не удалось скопировать: выдели текст отчёта вручную');
  }
});

// ---------- простой ZIP без сжатия ----------
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(data) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++) c = CRC_TABLE[(c ^ data[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files) {
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = new TextEncoder().encode(f.name);
    const crc = crc32(f.data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true); // имена в UTF-8
    local.setUint32(14, crc, true);
    local.setUint32(18, f.data.length, true);
    local.setUint32(22, f.data.length, true);
    local.setUint16(26, name.length, true);
    parts.push(local, name, f.data);

    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true);
    cen.setUint16(4, 20, true);
    cen.setUint16(6, 20, true);
    cen.setUint16(8, 0x0800, true);
    cen.setUint32(16, crc, true);
    cen.setUint32(20, f.data.length, true);
    cen.setUint32(24, f.data.length, true);
    cen.setUint16(28, name.length, true);
    cen.setUint32(42, offset, true);
    central.push(cen, name);
    offset += 30 + name.length + f.data.length;
  }
  const cenSize = central.reduce((s, p) => s + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, cenSize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: 'application/zip' });
}

// ---------- старт ----------
log('Браузер: ' + navigator.userAgent);
log('Поделиться файлами: ' + (navigator.canShare ? 'есть' : 'нет'));
log('Выбор папки (showDirectoryPicker): ' + ('showDirectoryPicker' in window ? 'есть' : 'нет'));
render().then(p => log('Фото в хранилище при открытии: ' + p.length));
</script>
</body>
</html>
