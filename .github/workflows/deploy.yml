# После каждого push в main собирает приложение и публикует его на GitHub Pages.
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const repo = context.repo
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            })
            core.setOutput('page_url', data.page_url)
            for (let attempt = 0; attempt < 60; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 10000))
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...repo, deployment_id: data.id
              })
              const status = result.data.status
              if (status === 'succeed') return
              if (!['queued', 'deployment_in_progress', 'deploying', 'updating_pages', 'syncing_files', 'purging_cdn'].includes(status)) {
                throw new Error('Pages deployment status: ' + status)
              }
            }
            throw new Error('Pages deployment timed out')
